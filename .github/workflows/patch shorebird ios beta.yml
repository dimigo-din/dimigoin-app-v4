name: Shorebird Patch iOS Beta

on:
  workflow_dispatch:

jobs:
  patch-ios-beta:
    name: Shorebird Patch iOS Beta
    runs-on: macos-26
    environment: beta

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Add Google Service Info
        run: echo "${{ secrets.IOS_GOOGLE_SERVICE_INFO }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Add Firebase Options
        run: echo "${{ secrets.FIREBASE_OPTIONS }}" > lib/firebase_options.dart

      - name: Make env directory
        run: mkdir -p env

      - name: Add .env file
        run: echo "${{ secrets.ENV }}" > env/.env

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Read Flutter version
        run: |
          FLUTTER_VERSION=$(flutter --version --machine | jq -r '.frameworkVersion')
          test -n "$FLUTTER_VERSION"
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - run: flutter pub get

      - name: Read version from pubspec.yaml
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Patch target version: $VERSION"

      - name: Create Shorebird iOS patch
        run: shorebird patch ios --flutter-version="$FLUTTER_VERSION" --release-version=${{ steps.app_version.outputs.version }} --no-codesign
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
